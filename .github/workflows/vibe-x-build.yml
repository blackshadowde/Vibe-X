name: Vibe X build

# Builds the Vibe X Android app (APK). Run it from the Actions tab.
#
# Only the app (Kotlin, Jetpack Compose) is built here. SimpleX's core
# (libsimplex.so / libsupport.so, written in Haskell) is taken from the
# official SimpleX release with the same version, so messaging, encryption
# and calls are exactly SimpleX's.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the APK as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and tags, for the release notes
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;23.1.7779620" "cmake;3.22.1" > /dev/null

      - name: SimpleX core for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^android.version_name=' apps/multiplatform/gradle.properties | cut -d= -f2)
          TAG="v$VERSION"
          echo "SimpleX version $TAG"
          mkdir -p core
          gh release download "$TAG" -R simplex-chat/simplex-chat -p '*.apk' -D core
          ls -la core
          LIBS=apps/multiplatform/common/src/commonMain/cpp/android/libs
          for apk in core/*.apk; do
            for abi in arm64-v8a armeabi-v7a; do
              if unzip -l "$apk" "lib/$abi/libsimplex.so" > /dev/null 2>&1; then
                mkdir -p "$LIBS/$abi"
                unzip -o -j "$apk" "lib/$abi/libsimplex.so" "lib/$abi/libsupport.so" -d "$LIBS/$abi" > /dev/null
                echo "core for $abi from $(basename "$apk")"
              fi
            done
          done
          test -f "$LIBS/arm64-v8a/libsimplex.so" || { echo "::error::No arm64 core found in the $TAG release"; exit 1; }
          ls -la "$LIBS"/*

      - name: Build
        working-directory: apps/multiplatform
        run: |
          set -o pipefail
          # Same preparations as SimpleX's own scripts/android/build-android.sh:
          # native libs packaged compressed and extracted on install, and the
          # optional re-compress task dropped (we sign in the next step).
          sed -i 's/${extract_native_libs}/true/' android/src/main/AndroidManifest.xml
          sed -i 's/jniLibs.useLegacyPackaging =.*/jniLibs.useLegacyPackaging = true/' android/build.gradle.kts
          sed -i '/^tasks {/Q' android/build.gradle.kts
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          # the in-app updater compares this build number with the release tag's
          sed -i "s/^vibe.build=.*/vibe.build=${GITHUB_RUN_NUMBER}/" gradle.properties
          mkdir -p ../../apk-out
          # One ABI per run, like upstream: the core libraries are large and
          # packaging both splits at once is what failed before.
          for abi in arm64-v8a armeabi-v7a; do
            [ -f "common/src/commonMain/cpp/android/libs/$abi/libsimplex.so" ] || continue
            sed -i "s/include(\".*/include(\"$abi\")/" android/build.gradle.kts
            echo "::group::Build $abi"
            rm -rf android/build/outputs/apk android/build/intermediates/apk
            if ! ./gradlew --no-daemon --stacktrace :android:assembleFossRelease 2>&1 | tee build.log; then
              level=error; [ "$abi" = arm64-v8a ] || level=warning
              grep -E "^e: |error:|What went wrong|Caused by" -A2 build.log | grep -v "^\s*at " | head -40 | while IFS= read -r line; do echo "::$level::$abi: $line"; done
              [ "$abi" = arm64-v8a ] && exit 1
              echo "::endgroup::"; continue
            fi
            echo "::endgroup::"
            cp android/build/outputs/apk/foss/release/android-foss-$abi-release-unsigned.apk ../../apk-out/
          done
          ls -la ../../apk-out

      - name: Sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KS:-}" ] && [ -n "${KSPASS:-}" ]; then
            printf '%s' "$KS" | base64 -d > key.jks
            ALIAS=vibe
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: signing with a one-off key. Installing a later build will need an uninstall first."
            KSPASS=vibexdebug
            keytool -genkeypair -keystore key.jks -alias vibe -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KSPASS" -keypass "$KSPASS" -dname "CN=Vibe X" > /dev/null
            ALIAS=vibe
          fi
          VERSION=$(grep '^android.version_name=' apps/multiplatform/gradle.properties | cut -d= -f2)
          OUT=apk-out
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            IN="$OUT/android-foss-$abi-release-unsigned.apk"
            [ -f "$IN" ] || continue
            NAME="vibe-x-$VERSION-$abi.apk"
            "$BT/zipalign" -f 4 "$IN" "dist/aligned.apk"
            "$BT/apksigner" sign --ks key.jks --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KSPASS" --key-pass "pass:$KSPASS" \
              --out "dist/$NAME" dist/aligned.apk
            rm dist/aligned.apk
          done
          rm -f key.jks
          ls -la dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-x-apk
          path: dist/*.apk

      - name: Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vibe-x-${VERSION}-${GITHUB_RUN_NUMBER}"
          # "What's new" for the in-app updater: the changes since the last release
          PREV=$(git tag -l 'vibe-x-*' --sort=-creatordate | head -1)
          {
            echo "### What's new in this update"
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-20"; fi
            git log $RANGE --no-merges --format='- %s' | grep -v -i '^- \(wip\|merge\)' | head -25
            echo
            echo "---"
            echo "Most phones: the arm64-v8a APK. Older 32-bit phones: armeabi-v7a."
          } > notes.md
          cat notes.md
          gh release create "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" \
            --title "Vibe X ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
