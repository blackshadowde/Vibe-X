name: Vibe X check

# Quick code check (compiles the Kotlin, no APK). Shows every error on the
# run's page and as an "Kotlin errors" check on the commit.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Compile
        working-directory: apps/multiplatform
        run: |
          set -o pipefail
          ./gradlew --no-daemon :android:compileFossReleaseKotlin 2>&1 | tee build.log || {
            grep -E "^e: " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          f=apps/multiplatform/build.log
          test -f $f || exit 0
          grep -E "^(e|w): |What went wrong|FAILURE" -A2 $f | head -c 60000 > report.txt
          python3 - <<'PY'
          import json, os
          json.dump({
            "name": "Kotlin errors",
            "head_sha": os.environ["GITHUB_SHA"],
            "status": "completed",
            "conclusion": "neutral",
            "output": {"title": "compile", "summary": "compile output", "text": open("report.txt").read() or "no errors"},
          }, open("check.json", "w"))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --input check.json > /dev/null
